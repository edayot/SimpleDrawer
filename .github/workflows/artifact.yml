name: Artifacts at every commit
on:
  push:
    branches:
      - master

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
        with:
          fetch-depth: 0
      - name: Setup Python 3.14
        uses: actions/setup-python@v2
        with:
          python-version: 3.14
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --group dev
      - name: Get Minecraft version
        id: get-mc-version
        run: |
          MC_VERSION=$(uv run python -c 'import yaml; print(yaml.safe_load(open("beet.yaml"))["minecraft"])')
          echo "mc_version=$MC_VERSION" >> "$GITHUB_OUTPUT"
        shell: bash
      - name: Setup OpenGL and Run Tests
        uses: edayot/model_resolver@master
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_HASH: ${{ github.sha }}
        with:
          commands: |
            uv run beet -s data_pack.name=\"datapack-bundled\" -s resource_pack.name=\"resourcepack-bundled\"
            uv run beet -s data_pack.name=\"datapack\" -s resource_pack.name=\"resourcepack\" -s meta.weld_deps.enabled=false

            uv run mcward test -p ./build/datapack-bundled -v $MC_VERSION --reporter github --coverage --coverage-report lcov:lcov.info

      
      # Upload build/ datapack.zip, resourcepack.zip, datapack-bundled.zip, resourcepack-bundled.zip
      - uses: actions/upload-artifact@v4
        with:
          name: datapack
          path: build/datapack/
      - uses: actions/upload-artifact@v4
        with:
          name: resourcepack
          path: build/resourcepack/
      - uses: actions/upload-artifact@v4
        with:
          name: datapack-bundled
          path: build/datapack-bundled/
      - uses: actions/upload-artifact@v4
        with:
          name: resourcepack-bundled
          path: build/resourcepack-bundled/
      - name: Upload results to Codecov
        if: github.event_name == 'push'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
  
